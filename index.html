<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>丹麥 & 冰島 15天家族夢幻之旅</title>
    <style>
        :root {
            --dk-red: #C8102E;
            --dk-red-light: #FFF0F2;
            --dk-red-dark: #8B0A1E;
            --is-blue: #003897;
            --is-blue-light: #EEF4FF;
            --is-blue-dark: #001F52;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.08);
            --radius-lg: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #1A202C;
            background-color: #F4F6F9;
            margin: 0;
            padding: 12px;
            -webkit-font-smoothing: antialiased;
            font-size: 18px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Top Bar Controls */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-menu {
            background: #2D3748;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .edit-controls {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: #3182CE;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save {
            background: #38A169;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* Hero Banner */
        .hero-banner {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            color: white;
            padding: 28px 18px 22px 18px;
            text-align: center;
            margin-bottom: 16px;
            background: linear-gradient(135deg, rgba(200, 16, 46, 0.88) 0%, rgba(0, 56, 151, 0.88) 100%),
                        url('https://images.unsplash.com/photo-1504829857797-ddff29c27927?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .hero-banner h1 {
            margin: 4px 0 6px 0;
            font-size: 1.85em;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .hero-banner p {
            margin: 0;
            font-size: 1.05em;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.35em;
            font-weight: 800;
            margin: 26px 0 14px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 3px solid;
        }

        .title-dk { color: var(--dk-red); border-color: var(--dk-red); }
        .title-is { color: var(--is-blue); border-color: var(--is-blue); }

        /* Card Styles */
        .day-card {
            background: white;
            border-radius: var(--radius-lg);
            margin-bottom: 18px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .day-card.denmark { border-top: 6px solid var(--dk-red); }
        .day-card.iceland { border-top: 6px solid var(--is-blue); }

        .day-header {
            padding: 14px 16px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05em;
        }

        .denmark .day-header { background: var(--dk-red-light); color: var(--dk-red-dark); }
        .iceland .day-header { background: var(--is-blue-light); color: var(--is-blue-dark); }

        .day-image-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            position: relative;
        }

        .day-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .day-body { padding: 16px; }

        .timeline { list-style: none; padding: 0; margin: 0; }
